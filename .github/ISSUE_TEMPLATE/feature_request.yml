name: Feature request
description: Something pyscopegui does not do yet, and you would like it to.
labels: ["enhancement"]
body:
  - type: textarea
    id: job
    attributes:
      label: What you are trying to do
      description: The job rather than the feature -- "see what the SPI bus is doing when the supply dips", not "add a button".
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How you do it now
      description: Another tool, a script, by hand, or not at all.

  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: If you have an idea of how it could work. For an instrument that is not supported, say which, and how it is talked to -- its maker's library, SCPI, a serial port.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Channels and Plot
        - Instrument pane
        - A new instrument
        - PicoScope
        - Rigol
        - Trigger and run modes
        - Several instruments at once
        - Event Log
        - Panes and layout
        - Installing
        - Something else
