# Blank issues are off, so every issue arrives as one of the three forms. The
# links below appear in the same chooser, beside them.
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/davhodg/pyscopegui/security/advisories/new
    about: Privately, please -- not as a public issue. See SECURITY.md.
  - name: Read the manual
    url: https://github.com/davhodg/pyscopegui/blob/master/pyscopegui/help/manual.md
    about: The same manual is in the application, under Help > Documentation.
