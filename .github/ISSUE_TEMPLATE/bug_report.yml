name: Bug report
description: Something in pyscopegui does not work the way the manual says it should.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected to happen, and what happened instead. Quote any message pyscopegui showed word for word.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: The steps from starting pyscopegui to the problem, one per line, in order. Say if it happens every time or only sometimes.

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        *Help > Diagnostics...* opens a report and copies it to the clipboard: the versions of pyscopegui, Python, PySide6, pyqtgraph and numpy, the platform, each instrument and its settings and driver, how many samples each channel has received, the trigger, and the last warnings and errors. Paste it here. The settings include a scope's network address, and the Event Log names a scope's serial number as it opens; remove either if you would rather.
        If pyscopegui will not start at all, say so, and paste whatever it printed instead.
      render: text

  - type: dropdown
    id: instrument
    attributes:
      label: Instrument
      options:
        - None -- Demo signals
        - PicoScope 2202 to 2205A
        - PicoScope 2206 to 2408B, and MSOs
        - pycangui signals
        - Rigol DS1000Z series
        - Tektronix TDS/TPS 2000 series, on a serial port or USB
        - Another -- say which above
    validations:
      required: true

  - type: dropdown
    id: installed
    attributes:
      label: Installed with
      options:
        - The Windows installer
        - The launcher (pyscopegui.cmd or pyscopegui.sh)
        - pip
        - A source checkout, for development
    validations:
      required: true

  - type: textarea
    id: event-log
    attributes:
      label: Event Log
      description: What the Event Log said around the time -- warnings and errors especially. A traceback is worth more than any description of one.
      render: text
